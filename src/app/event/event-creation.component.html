<div class="min-h-screen bg-gray-50/50 py-10">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-3xl border border-gray-200 p-8 shadow-sm">
      <div class="flex items-start justify-between mb-6">
        <div>
          <h2 class="text-3xl font-bold text-gray-900">Créer un événement</h2>
          <p class="text-gray-600">Renseignez les informations de votre événement</p>
        </div>
        <a routerLink="/evenements"
           class="text-sm text-blue-600 hover:text-blue-700 hover:underline">Retour à la liste</a>
      </div>

      <form (ngSubmit)="create()" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Catégorie</label>
          <select name="categorie" [(ngModel)]="newEvent.categorie" required
                  class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option value="" disabled>— Choisir —</option>
            <option *ngFor="let c of categories" [value]="c.id">{{ c.label }}</option>
          </select>
        </div>

        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Niveau</label>
          <select name="niveau" [(ngModel)]="newEvent.niveau"
                  class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <option *ngFor="let n of niveaux" [value]="n">{{ n }}</option>
          </select>
        </div>

        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
          <input name="date" type="datetime-local" [(ngModel)]="newEvent.date" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>

        <div class="md:col-span-1">
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre max de participants</label>
            <input
            name="nombreMaxParticipant"
            type="number"
            min="1"
            inputmode="numeric"
            [(ngModel)]="newEvent.nombreMaxParticipants"
            class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
          <input name="adresse" [(ngModel)]="newEvent.adress" required
                 class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>

        <div class="md:col-span-2 flex items-center justify-between mt-2">
          <div *ngIf="errorMsg"
               class="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2">
            {{ errorMsg }}
          </div>

          <button type="submit"
                  [disabled]="loading"
                  class="inline-flex items-center px-5 py-2.5 rounded-xl bg-blue-600 text-white hover:bg-blue-700 transition shadow-sm disabled:opacity-60">
            <svg *ngIf="!loading" class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v12m6-6H6"/>
            </svg>
            <svg *ngIf="loading" class="w-5 h-5 mr-2 animate-spin" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" class="opacity-25"/>
              <path d="M4 12a8 8 0 018-8" fill="currentColor" class="opacity-75"/>
            </svg>
            Créer l’événement
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
