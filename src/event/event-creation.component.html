<div class="min-h-screen bg-gray-50 flex items-center justify-center py-8">
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8 w-full max-w-lg">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">Créer un événement</h2>

    <form (ngSubmit)="create()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Catégorie</label>
        <select name="categorie" [(ngModel)]="newEvent.categorie" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <option value="" disabled>— Choisir —</option>
          <option *ngFor="let c of categories" [value]="c.id">{{ c.label }}</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
        <input name="date" type="datetime-local" [(ngModel)]="newEvent.date" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Adresse</label>
        <input name="adresse" [(ngModel)]="newEvent.adress" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Niveau</label>
        <select name="niveau" [(ngModel)]="newEvent.niveau"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          <option *ngFor="let n of niveaux" [value]="n">{{ n }}</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre max de participants</label>
        <input name="nombreMaxParticipants" type="number" min="1"
               [(ngModel)]="newEvent.nombreMaxParticipants"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>

      <button type="submit"
              class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-sm">
        Créer
      </button>
    </form>
  </div>
</div>
