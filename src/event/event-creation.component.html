<div class="min-h-screen bg-gray-50 flex items-center justify-center py-8">
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8 w-full max-w-lg">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center">
      <!-- <mat-icon class="mr-2 text-blue-600">event</mat-icon> -->
      Créer un événement
    </h2>
    <form (ngSubmit)="create()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Titre</label>
        <input name="title" [(ngModel)]="newEvent.title" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
        <input name="date" type="datetime-local" [(ngModel)]="newEvent.date"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Lieu</label>
        <input name="lieu" [(ngModel)]="newEvent.lieu"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea name="description" [(ngModel)]="newEvent.description"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none min-h-[80px]" rows="4"></textarea>
      </div>
      <button type="submit"
        class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shadow-sm">
        <mat-icon class="mr-2">add</mat-icon>
        Créer
      </button>
    </form>
  </div>
</div>
