<section>
  <h2>Événements</h2>

  <ul>
    <li *ngFor="let ev of events" class="mb-4">
      <strong>{{ catLabel(ev.categorie) }}</strong>
      — {{ ev.date }}
      — {{ ev.adress }}
      <div class="text-sm text-gray-600">
        Niveau : {{ ev.niveau }} • Max : {{ ev.nombreMaxParticipants }}
      </div>
    </li>
  </ul>

  <a routerLink="/evenements/creer">Créer un événement</a>
</section>
